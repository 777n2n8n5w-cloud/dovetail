  var KEY_STORE = "dovetail_unlock_v1";
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  async function keyFromPassword(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256);
    return new Uint8Array(bits);
  }
  async function openApp(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
    var html = new TextDecoder().decode(plain);
    // Swap the lock screen out for the app completely.
    var doc = new DOMParser().parseFromString(html, "text/html");
    Array.prototype.forEach.call(doc.documentElement.attributes, function (a) { document.documentElement.setAttribute(a.name, a.value); });
    document.head.innerHTML = doc.head.innerHTML;
    document.title = doc.title;
    document.body.innerHTML = "";
    Array.prototype.forEach.call(doc.body.attributes, function (a) { document.body.setAttribute(a.name, a.value); });
    Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) { document.body.appendChild(document.importNode(n, true)); });

    Array.prototype.slice.call(document.body.querySelectorAll("script")).forEach(function (old) {

      sc.textContent = old.textContent;
      old.parentNode.replaceChild(sc, old);

  var err = document.getElementById("err"), btn = document.getElementById("go"), pwEl = document.getElementById("pw");

    err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking\u2026";
    try {
      var raw = await keyFromPassword(pwEl.value);
      if (document.getElementById("rem").checked) { try { localStorage.setItem(KEY_STORE, toB64(raw)); } catch (e) {} }
